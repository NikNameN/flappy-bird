<title>Aiviro Flappy — Карайкоз Н. В.</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #20303a;
               overscroll-behavior: none; touch-action: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
               font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body { position: fixed; inset: 0; }
  #wrap { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; touch-action: none; }
  canvas { position: absolute; top: 0; display: block; touch-action: none; }
  /* Невидимый элемент, чтобы прочитать env(safe-area-inset-*) из JS */
  #safe { position: fixed; visibility: hidden; pointer-events: none;
          padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .btn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); width: 44px; height: 44px;
         border: 2px solid rgba(40,40,40,.55); border-radius: 12px; background: rgba(255,255,255,.55);
         padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
         touch-action: none; -webkit-tap-highlight-color: transparent; outline: none; z-index: 2; }
  .btn:active { background: rgba(255,255,255,.8); }
  .btn svg { width: 24px; height: 24px; fill: #2a2a2a; pointer-events: none; }
  #pauseBtn { right: calc(env(safe-area-inset-right, 0px) + 10px); }
  #muteBtn  { left: calc(env(safe-area-inset-left, 0px) + 10px); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="muteBtn" class="btn" aria-label="Звук"></button>
  <button id="pauseBtn" class="btn hidden" aria-label="Пауза"></button>
</div>
<div id="safe"></div>
<script>
"use strict";
// ===== Aiviro Flappy — Карайкоз Н. В. (HTML5 Canvas, один файл, работает офлайн) =====
// Логический мир: высота не меньше 640, ширина не меньше 360 «игровых пикселей».
// Физика задана в игровых пикселях и секундах и не зависит от размера экрана и частоты кадров.

const BASE_H = 640, MIN_W = 360, MAX_W = 960, GROUND_H = 80;
const SCROLL = 160, PIPE_SPACING = 240;               // скорость прокрутки, шаг труб
const R = 16, GRAVITY = 1500, FLAP = -460, MAX_FALL = 700; // физика птицы
const PIPE_W = 70, GAP = 160, CAP_H = 26, CAP_EX = 5;  // коридор препятствия (как у труб)
const STEP = 1 / 120;          // фиксированный шаг физики: 60 Гц и 120 Гц дают одинаковую игру
const MAX_FRAME = 0.1;         // ограничение dt (после сворачивания, подвисания)
const OVER_LOCK = 0.4;         // после проигрыша 400 мс касания игнорируются

let W = 480, H = 640, GROUND_Y = H - GROUND_H, BIRD_X = 130, BIRD_Y = 300;
let k = 1, dpr = 1;                                    // CSS-пикселей на игровой пиксель, devicePixelRatio
let safe = { t: 0, r: 0, b: 0, l: 0 };                 // безопасные отступы в игровых пикселях

const wrap = document.getElementById("wrap");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const pauseBtn = document.getElementById("pauseBtn");
const muteBtn = document.getElementById("muteBtn");
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0 ||
                (window.matchMedia && matchMedia("(pointer: coarse)").matches);

// ----- Хранилище (в приватном режиме Safari может бросать исключения) -----
function lsGet(key, def) { try { const v = localStorage.getItem(key); return v === null ? def : v; } catch (e) { return def; } }
function lsSet(key, v) { try { localStorage.setItem(key, String(v)); } catch (e) {} }

// ----- Состояние игры -----
let state = "start";            // start | playing | paused | over
let score = 0, best = parseInt(lsGet("flappyBest", "0"), 10) || 0;
let groundOffset = 0, flash = 0, overLock = 0;
const bird = { x: BIRD_X, y: BIRD_Y, vy: 0, wing: 0, idle: 0 };
let pipes = [];
const clouds = [];
function rand(a, b) { return a + Math.random() * (b - a); }

// ----- Размер экрана: холст на весь экран, чёткость по devicePixelRatio -----
function readSafe() {
  const cs = getComputedStyle(document.getElementById("safe"));
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
           b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function resize() {
  const cw = wrap.clientWidth || window.innerWidth;
  const ch = wrap.clientHeight || window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  // Высота мира = 640; если экран узкий (портрет телефона) — ширина 360, а высота растёт
  k = ch / BASE_H;
  if (cw / k < MIN_W) k = cw / MIN_W;
  const oldGround = GROUND_Y;
  H = ch / k;
  W = Math.min(cw / k, MAX_W);                         // на широком мониторе — не шире 960, по центру
  GROUND_Y = H - GROUND_H;
  BIRD_X = Math.round(Math.min(W * 0.3, 150));
  BIRD_Y = GROUND_Y * 0.5;
  const cssW = W * k, cssH = H * k;
  canvas.style.width = cssW + "px"; canvas.style.height = cssH + "px";
  canvas.style.left = ((cw - cssW) / 2) + "px";
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  const s = readSafe();
  safe = { t: s.t / k, r: s.r / k, b: s.b / k, l: s.l / k };
  const off = (cw - cssW) / 2;                           // кнопки — внутри игрового поля
  muteBtn.style.left = (off + s.l + 10) + "px"; pauseBtn.style.right = (off + s.r + 10) + "px";
  // Подстраиваем объекты под новый размер
  bird.x = BIRD_X;
  if (state === "start") bird.y = BIRD_Y;
  else bird.y = Math.min(bird.y + (GROUND_Y - oldGround), GROUND_Y - R);
  for (const p of pipes) p.gapY = clampGap(p.gapY + (GROUND_Y - oldGround) / 2);
  while (clouds.length < 7) clouds.push({ x: rand(0, W), y: 0 });
  for (const c of clouds) c.y = rand(30, GROUND_Y * 0.45);
  if (state === "playing") pause();                    // поворот экрана во время игры — пауза
  draw();
}
function clampGap(g) { return Math.max(70, Math.min(GROUND_Y - GAP - 70, g)); }
let resizeTimer = 0;
function scheduleResize() { resize(); clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 250); }
window.addEventListener("resize", scheduleResize);
window.addEventListener("orientationchange", scheduleResize);
if (window.visualViewport) visualViewport.addEventListener("resize", scheduleResize);

// Высота прохода случайная, но не дальше 220 от предыдущей — на высоком экране телефона игра остаётся честной
function newPipe(x) {
  let lo = 70, hi = GROUND_Y - GAP - 70;
  if (pipes.length) { const prev = pipes[pipes.length - 1].gapY; lo = Math.max(lo, prev - 220); hi = Math.min(hi, prev + 220); }
  return { x: x, gapY: rand(lo, Math.max(lo, hi)), passed: false };
}
function resetBird() { bird.x = BIRD_X; bird.y = BIRD_Y; bird.vy = 0; bird.wing = 0; bird.idle = 0; }

function startGame() {
  pipes = []; score = 0; resetBird();
  for (let i = 0; i < 3; i++) pipes.push(newPipe(W * 0.6 + 200 + i * PIPE_SPACING));
  state = "playing"; bird.vy = FLAP; sound("flap");
  updateButtons();
}

// ----- Звук (WebAudio создаётся только после первого касания — требование iOS) -----
let audio = null, muted = lsGet("flappyMuted", "0") === "1";
function unlockAudio() {
  try {
    if (!audio) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
    if (audio && audio.state === "suspended") audio.resume();

}

  o.type = type; o.frequency.setValueAtTime(freq, t0);
  o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.02);

  if (muted || !audio || audio.state !== "running") return;
  try {
    if (name === "flap") tone(520, 760, 0.09, "square", 0.035);
    else if (name === "point") { tone(880, 880, 0.08, "triangle", 0.06); tone(1320, 1320, 0.12, "triangle", 0.06, 0.08); }
    else if (name === "hit") { tone(220, 60, 0.35, "sawtooth", 0.07); }
  } catch (e) {}

function updateButtons() {
  pauseBtn.classList.toggle("hidden", !(state === "playing" || state === "paused"));
  pauseBtn.innerHTML = state === "paused" ? ICON_PLAY : ICON_PAUSE;
  pauseBtn.setAttribute("aria-label", state === "paused" ? "Продолжить" : "Пауза");
  muteBtn.innerHTML = muted ? ICON_MUTE : ICON_SOUND;
  muteBtn.setAttribute("aria-label", muted ? "Включить звук" : "Выключить звук");
}
function pause() { if (state === "playing") { state = "paused"; updateButtons(); } }
function resume() { if (state === "paused") { state = "playing"; lastTime = performance.now(); acc = 0; updateButtons(); } }
function togglePause() { if (state === "playing") pause(); else if (state === "paused") resume(); }
function toggleMute() { muted = !muted; lsSet("flappyMuted", muted ? "1" : "0"); updateButtons(); }

// Кнопки реагируют на pointerdown и не передают касание игре
function bindButton(el, fn) {
  const h = e => { e.preventDefault(); e.stopPropagation(); unlockAudio(); fn(); };
  if (window.PointerEvent) el.addEventListener("pointerdown", h, { passive: false });
  else { el.addEventListener("touchstart", h, { passive: false }); el.addEventListener("mousedown", h); }
  el.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); });
}
bindButton(pauseBtn, togglePause);
bindButton(muteBtn, toggleMute);

// ----- Действие игрока: касание, клик, пробел, стрелка вверх -----
function action() {
  unlockAudio();
  if (state === "start") startGame();
  else if (state === "playing") { bird.vy = FLAP; bird.wing = 0; sound("flap"); }
  else if (state === "paused") resume();
  else if (state === "over" && overLock <= 0) { state = "start"; pipes = []; resetBird(); updateButtons(); }
}
function onPress(e) {
  if (e.cancelable) e.preventDefault();
  if (e.type === "pointerdown" && e.pointerType === "mouse" && e.button !== 0) return;
  action();
}
if (window.PointerEvent) canvas.addEventListener("pointerdown", onPress, { passive: false });
else { canvas.addEventListener("touchstart", onPress, { passive: false }); canvas.addEventListener("mousedown", onPress); }
// Глушим системные жесты: прокрутку, двойной тап и щипок (iOS Safari)
const stop = e => { if (e.cancelable) e.preventDefault(); };
document.addEventListener("touchstart", stop, { passive: false });
document.addEventListener("touchmove", stop, { passive: false });
document.addEventListener("touchend", stop, { passive: false });
document.addEventListener("gesturestart", stop, { passive: false });
document.addEventListener("gesturechange", stop, { passive: false });
document.addEventListener("dblclick", stop, { passive: false });
document.addEventListener("contextmenu", stop);

window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); if (!e.repeat) action(); }
  else if (e.code === "KeyP" || e.code === "Escape") togglePause();
  else if (e.code === "KeyM") toggleMute();
});

document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

function gameOver() {
  state = "over"; flash = 0.4; overLock = OVER_LOCK; sound("hit");
  if (score > best) { best = score; lsSet("flappyBest", best); }
  updateButtons();
}

// ----- Логика одного шага физики (dt = STEP) -----
function scrollBg(dt) {
  groundOffset = (groundOffset + SCROLL * dt) % 24;
  for (const c of clouds) {              // облака медленнее труб — параллакс
    c.x -= SCROLL * 0.2 * dt;
    if (c.x < -120) { c.x = W + rand(0, 100); c.y = rand(30, GROUND_Y * 0.45); }
  }
}
function update(dt) {
  if (state !== "over") animT += dt;
  if (flash > 0) flash -= dt;
  if (overLock > 0) overLock -= dt;
  if (state === "start") {
    bird.idle += dt; bird.y = BIRD_Y + Math.sin(bird.idle * 4) * 8; bird.wing += dt * 12;
    scrollBg(dt);
  } else if (state === "playing") {
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt; bird.wing += dt * 18;
    scrollBg(dt);
    for (const p of pipes) {
      p.x -= SCROLL * dt;
      if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; sound("point"); }
    }
    pipes = pipes.filter(p => p.x + PIPE_W + CAP_EX >= 0);
    while (pipes.length === 0 || pipes[pipes.length - 1].x < W + PIPE_SPACING) {
      const lastX = pipes.length ? pipes[pipes.length - 1].x : W;
      pipes.push(newPipe(lastX + PIPE_SPACING));
    }
    // Столкновения: круг логотипа (чуть меньше рисунка) против прямоугольников деталей роботов
    const r = R - 3;
    let hit = bird.y - r <= 0 || bird.y + r >= GROUND_Y;
    for (const p of pipes) {
      if (bird.x + r < p.x - CAP_EX || bird.x - r > p.x + PIPE_W + CAP_EX) continue;
      for (const b of robotBoxes(p)) if (circleRect(bird.x, bird.y, r, b)) { hit = true; break; }
      if (hit) break;
    }
    if (hit) gameOver();
  } else if (state === "over") {
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y = Math.min(bird.y + bird.vy * dt, GROUND_Y - R);
  }
}

// ----- Отрисовка -----
function ellipse(x, y, w, h) { ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, "rgb(80,170,235)"); g.addColorStop(1, "rgb(190,235,255)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND_Y);
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  for (const c of clouds) { ellipse(c.x, c.y, 60, 34); ellipse(c.x + 25, c.y - 14, 56, 44); ellipse(c.x + 55, c.y, 52, 32); }
}
// ----- Оранжевые коботы (стилизация 6-осевого AUBO i10: круглое основание, модули суставов,
// две трубы-звена, трёхосевое запястье с фланцем). Рисуются векторно, без логотипов.
// Детали считаются от точки крепления (пол или потолок) вдоль руки: d — расстояние от крепления.
let animT = 0;
const ORANGE = "#FF6A13", OR_LIGHT = "#FF9A4D", OR_DARK = "#C94A00", OUTLINE = "#5a2a05";
const GREY = "#3b3f45", GREY_L = "#7a8089";
function robotParts(h) {
  // Номинальная длина неизменяемых деталей; трубы (tube) тянутся до края прохода
  const full = [
    { k: "base",  w: 64, h: 20, o: 0 },   // основание Ø218 мм с фланцем крепления
    { k: "joint", w: 46, h: 22, o: 0 },   // J1 — поворот основания
    { k: "joint", w: 62, h: 40, o: 0, cap: 1 }, // J2 — плечо
    { k: "tube",  w: 30, h: 0,  o: -6 },  // плечевое звено (труба)
    { k: "joint", w: 54, h: 36, o: 0, cap: 1 }, // J3 — локоть
    { k: "tube",  w: 26, h: 0,  o: 6 },   // предплечье (труба)
    { k: "joint", w: 42, h: 26, o: 0, cap: 1 }, // J4 — запястье 1
    { k: "joint", w: 36, h: 22, o: 0 },   // J5/J6 — запястье 2–3
    { k: "tool",  w: 34, h: 22, o: 0 },   // фланец + захват
  ];
  let parts = full, fixed = 188;
  if (h < fixed + 20) {                   // короткий робот: без локтя и предплечья
    parts = [full[0], full[2], { k: "tube", w: 30, h: 0, o: 0 }, full[6], full[8]]; fixed = 108;
  }
  const s = Math.min(1, h / (fixed + 10));
  const tubes = parts.filter(q => q.k === "tube").length;
  const free = Math.max(0, h - fixed * s);
  const tl = [free * 0.55, free * 0.45];
  let d = 0, ti = 0; const out = [];
  for (const q of parts) {
    const len = q.k === "tube" ? (tubes === 1 ? free : tl[ti++]) : q.h * s;
    out.push({ k: q.k, w: q.w, o: q.o, cap: q.cap, d: d, h: len }); d += len;
  }
  return out;
}
// Прямоугольники столкновений в мировых координатах (рисунок совпадает с ними)
function robotBoxes(p) {
  const cx = p.x + PIPE_W / 2, by = p.gapY + GAP, boxes = [];
  for (const q of robotParts(p.gapY)) if (q.h > 0)        // верхний — висит с потолка
    boxes.push({ x: cx + q.o - q.w / 2, y: q.d, w: q.w, h: q.h });
  for (const q of robotParts(GROUND_Y - by)) if (q.h > 0) // нижний — стоит на полу
    boxes.push({ x: cx + q.o - q.w / 2, y: GROUND_Y - q.d - q.h, w: q.w, h: q.h });

}
function circleRect(cx, cy, r, b) {

  ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();

  g.addColorStop(0, OR_DARK); g.addColorStop(0.25, OR_LIGHT); g.addColorStop(0.55, ORANGE); g.addColorStop(1, OR_DARK);
  return g;
}

  const x = q.o - q.w / 2, y = q.d, w = q.w, h = q.h;
  if (h <= 0) return;
  ctx.lineWidth = 2; ctx.strokeStyle = OUTLINE;
  if (q.k === "tube") {
    ctx.fillStyle = orangeFill(x, w); ctx.fillRect(x, y - 1, w, h + 2);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.28)"; ctx.fillRect(x + w * 0.22, y, 4, h);
  } else if (q.k === "base") {
    ctx.fillStyle = GREY; rrect(x, y, w, Math.min(6, h), 2); ctx.fill();            // плита крепления
    ctx.fillStyle = orangeFill(x + 4, w - 8); rrect(x + 4, y + Math.min(6, h) - 1, w - 8, h - Math.min(6, h) + 1, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = GREY_L; ctx.fillRect(x + 8, y + h - 4, w - 16, 3);
  } else if (q.k === "joint") {
    ctx.fillStyle = orangeFill(x, w); rrect(x, y, w, h, Math.min(w, h) * 0.45); ctx.fill(); ctx.stroke();
    ctx.fillStyle = GREY; ctx.fillRect(x + 3, y + h * 0.5 - 1.5, w - 6, 3);        // стык модулей
    if (q.cap) {                                                                   // торцевая крышка сустава
      const rr = Math.min(w, h) * 0.36, cx = q.o, cy = y + h / 2;

    ctx.fillStyle = GREY_L; rrect(x + 4, y, w - 8, fh, 2); ctx.fill();             // фланец
    ctx.fillStyle = GREY; rrect(x + 2, y + fh, w - 4, (h - fh) * 0.45, 3); ctx.fill(); // корпус захвата
    const fy = y + fh + (h - fh) * 0.45, fl = h - (fy - y), open = 3 + 6 * wiggle;  // пальцы (анимация)

function drawRobot(cx, mountY, dir, h, phase) {
  if (h <= 0) return;
  ctx.save(); ctx.translate(cx, mountY); ctx.scale(1, dir);

function drawPipe(p) {
  const cx = p.x + PIPE_W / 2, by = p.gapY + GAP;
  drawRobot(cx, 0, 1, p.gapY, p.gapY * 0.1);            // с потолка, рука вниз

function drawGround() {
  ctx.fillStyle = "rgb(222,200,130)"; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = "rgb(110,190,60)"; ctx.fillRect(0, GROUND_Y, W, 16);
  ctx.fillStyle = "rgb(90,160,45)";
  for (let x = -groundOffset - 24; x < W + 24; x += 24) {
    ctx.beginPath(); ctx.moveTo(x, GROUND_Y + 16); ctx.lineTo(x + 12, GROUND_Y + 16);
    ctx.lineTo(x + 20, GROUND_Y + 4); ctx.lineTo(x + 8, GROUND_Y + 4); ctx.fill();
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgb(70,110,30)"; line(0, GROUND_Y, W, GROUND_Y);
  ctx.strokeStyle = "rgb(180,150,80)"; line(0, GROUND_Y + 16, W, GROUND_Y + 16);
  ctx.fillStyle = "rgba(120,90,40,0.85)";
  ctx.font = "600 12px -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

    text("Игра окончена", 38, by + 20, "rgb(220,90,30)");
    text("Счёт: " + score, 30, by + 88, "rgb(255,250,235)");
    text("Лучший: " + best, 30, by + 130, "rgb(255,250,235)");
    if (overLock <= 0) text(isTouch ? "Коснись — заново" : "ПРОБЕЛ — заново", 26, by + 190, "rgb(140,230,90)");
  }
  if (flash > 0) {                                  // белая вспышка при столкновении
    ctx.fillStyle = "rgba(255,255,255," + (Math.min(1, flash / 0.4) * 0.7) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

// ----- Игровой цикл: requestAnimationFrame + фиксированный шаг физики -----
// На 60 Гц за кадр делается 2 шага по 1/120 с, на 120 Гц (ProMotion) — 1 шаг:
// скорость игры одинаковая на любом экране.
let lastTime = performance.now(), acc = 0;
function tick(frameDt) {
  if (!(frameDt > 0)) frameDt = 0;
  if (frameDt > MAX_FRAME) frameDt = MAX_FRAME;
  if (state === "paused") { acc = 0; return; }
  acc += frameDt;
  let n = 0;
  while (acc >= STEP && n < 20) { update(STEP); acc -= STEP; n++; }
}
function loop(now) {
  tick((now - lastTime) / 1000); lastTime = now;
  draw();
  requestAnimationFrame(loop);
}
resize();
updateButtons();
requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });
</script>
</body>
